# Example Keepalived (VRRP) — node A (MASTER).
# Mirror on node B with state BACKUP and priority 90.
# Replace interface name, VIP and auth password.

global_defs {
    router_id LB_LAB_A
    script_user keepalived_script
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/bin/killall -0 haproxy"
    interval 2
    weight -20
    fall 2
    rise 2
}

vrrp_instance VI_EDGE {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass REPLACE_ME_VRRP_PASS
    }

    virtual_ipaddress {
        10.10.0.10/24
    }

    track_script {
        chk_haproxy
    }
}
