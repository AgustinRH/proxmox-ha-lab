# Example HAProxy config — replace IPs and cert paths before use.
# No production secrets in this file.

global
    log /dev/log local0
    maxconn 4096
    user haproxy
    group haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    retries 3

frontend fe_https
    bind *:443 ssl crt /etc/haproxy/certs/lab.pem
    http-request set-header X-Forwarded-Proto https
    default_backend be_app

frontend fe_stats
    bind 10.10.0.11:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    # Protect with ACL / VPN-only binding in a real lab

backend be_app
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server app1 10.10.40.11:8080 check
    server app2 10.10.40.12:8080 check

# Optional: TCP pass-through to Galera via a single writer VIP
listen galera_writer
    bind 10.10.0.10:3306
    mode tcp
    option mysql-check user haproxy_check
    balance first
    server db1 10.10.30.11:3306 check
    server db2 10.10.30.12:3306 check backup
    server db3 10.10.30.13:3306 check backup
