# HAProxy — runs on each app VM that may own the VIP
# Listens on :80 (and optionally the VIP). Apache listens on :8080.
# Backends: one primary app/Galera node per site (a1, b1, c1).
# Path example: /etc/haproxy/haproxy.cfg

global
    # Syslog facility for access / errors
    log /dev/log local0
    maxconn 4096
    user haproxy
    group haproxy
    # Runtime API socket for `echo show stat | socat ...`
    stats socket /run/haproxy/admin.sock mode 660 level admin
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    retries 3

# ---------------------------------------------------------------------------
# Frontend: clients hit the VIP 10.10.40.10 (or any local IP) on port 80
# ---------------------------------------------------------------------------
frontend fe_http
    bind *:80
    # Mark HTTPS if you terminate TLS elsewhere / add bind *:443 ssl crt ...
    default_backend be_app

# ---------------------------------------------------------------------------
# Backend: three site primaries (Galera members that also serve HTTP)
# Health check hits Apache on :8080 — unhealthy nodes are removed automatically
# ---------------------------------------------------------------------------
backend be_app
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    # Site A primary app + Galera node
    server webdb-a1 10.10.40.21:8080 check inter 3s fall 3 rise 2
    # Site B primary
    server webdb-b1 10.10.40.31:8080 check inter 3s fall 3 rise 2
    # Site C primary
    server webdb-c1 10.10.40.41:8080 check inter 3s fall 3 rise 2
    # Optional extra app VMs per site (uncomment if you deploy them):
    # server webdb-a2 10.10.40.22:8080 check
    # server webdb-b2 10.10.40.32:8080 check
    # server webdb-c2 10.10.40.42:8080 check

# ---------------------------------------------------------------------------
# Optional: TCP pass-through to Galera for admin tools (not used by PHP;
# PHP should talk to local ProxySQL on 127.0.0.1:6033)
# ---------------------------------------------------------------------------
# listen galera_readers
#     bind 10.10.40.10:3306
#     mode tcp
#     option mysql-check user haproxy_check
#     balance roundrobin
#     server galera-a1 10.10.40.21:3306 check
#     server galera-b1 10.10.40.31:3306 check
#     server galera-c1 10.10.40.41:3306 check

# ---------------------------------------------------------------------------
# Stats page — bind to mgmt/services IP, NOT the public Internet
# ---------------------------------------------------------------------------
frontend fe_stats
    bind 10.10.40.21:8404
    stats enable
    stats uri /haproxy-stats
    stats refresh 10s
    # Placeholder credentials — replace before use
    stats auth <CHANGE_ME_USER>:<CHANGE_ME_PASSWORD>
    stats admin if TRUE
