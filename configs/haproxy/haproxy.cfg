# HAProxy — runs on each app VM that may own the VIP
# Apache listens on :8080; HAProxy on :80 when this VM holds 10.99.0.10.
# Path example: /etc/haproxy/haproxy.cfg

global
    log /dev/log local0
    maxconn 4096
    user haproxy
    group haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    retries 3

# Clients hit VIP 10.99.0.10 (or *) on port 80
frontend fe_http
    bind *:80
    default_backend be_app

# One primary app/Galera VM per site (same guest runs HTTP + MariaDB)
backend be_app
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server webdb-a1 10.10.40.21:8080 check inter 3s fall 3 rise 2
    server webdb-b1 10.20.40.21:8080 check inter 3s fall 3 rise 2
    server webdb-c1 10.30.40.21:8080 check inter 3s fall 3 rise 2

# Optional: TCP to Galera for admin tools (PHP should use local ProxySQL)
# listen galera_readers
#     bind 10.99.0.10:3306
#     mode tcp
#     option mysql-check user haproxy_check
#     balance roundrobin
#     server galera-a1 10.10.40.21:3306 check
#     server galera-b1 10.20.40.21:3306 check
#     server galera-c1 10.30.40.21:3306 check

# Stats — localhost only (same config on every node)
frontend fe_stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /haproxy-stats
    stats refresh 10s
    stats auth <CHANGE_ME_USER>:<CHANGE_ME_PASSWORD>
