# Keepalived — lower-priority peer (example: webdb-b1 = 10.20.40.21)
# state BACKUP on all peers; set LOCAL_SITE=b for notify-vip-wg.sh.
# auth_pass: max 8 characters.

global_defs {
    router_id WEBDB_B1
    script_user keepalived_script
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/bin/pidof haproxy"
    interval 2
    weight -30
    fall 2
    rise 2
}

vrrp_instance VI_APP {
    state BACKUP
    interface ens18
    virtual_router_id 40
    priority 130
    advert_int 1

    unicast_src_ip 10.20.40.21
    unicast_peer {
        10.10.40.21
        10.30.40.21
    }

    authentication {
        auth_type PASS
        auth_pass ChgMe_01
    }

    virtual_ipaddress {
        10.99.0.10/32
    }

    track_script {
        chk_haproxy
    }

    notify_master "/etc/keepalived/notify-vip-wg.sh"
    notify_backup "/etc/keepalived/notify-vip-wg.sh"
    notify_fault  "/etc/keepalived/notify-vip-wg.sh"
}
