# Keepalived — backup / lower-priority peer (example: webdb-b1 = 10.10.40.31)
# Copy to each non-primary app VM and lower priority uniquely:
#   webdb-a2 → 140, webdb-b1 → 130, webdb-b2 → 120, webdb-c1 → 110, webdb-c2 → 100
# Install as /etc/keepalived/keepalived.conf

global_defs {
    router_id WEBDB_B1
    script_user keepalived_script
    enable_script_security
}

vrrp_script chk_haproxy {
    # Same check as master: VIP only if HAProxy is alive here
    script "/usr/bin/killall -0 haproxy"
    interval 2
    weight -30
    fall 2
    rise 2
}

vrrp_instance VI_APP {
    # BACKUP: never preempt by label alone; priority decides
    state BACKUP
    interface ens18
    # Same VRID as master — one VRRP group for 10.10.40.10
    virtual_router_id 40
    # Lower than master's 150 so Site A wins when healthy
    priority 130
    advert_int 1

    authentication {
        auth_type PASS
        # Must match every peer in VI_APP
        auth_pass <CHANGE_ME>
    }

    virtual_ipaddress {
        10.10.40.10/24
    }

    track_script {
        chk_haproxy
    }
}
