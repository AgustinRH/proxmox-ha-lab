# Keepalived — lowest-priority peer (example: webdb-c1 = 10.30.40.21)
# Same BACKUP + unicast pattern; set LOCAL_SITE=c in notify-vip-wg.env.

global_defs {
    router_id WEBDB_C1
    script_user keepalived_script
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/bin/pidof haproxy"
    interval 2
    weight -30
    fall 2
    rise 2
}

vrrp_instance VI_APP {
    state BACKUP
    interface ens18
    virtual_router_id 40
    priority 110
    advert_int 1

    unicast_src_ip 10.30.40.21
    unicast_peer {
        10.10.40.21
        10.20.40.21
    }

    authentication {
        auth_type PASS
        auth_pass ChgMe_01
    }

    virtual_ipaddress {
        10.99.0.10/32
    }

    track_script {
        chk_haproxy
    }

    notify_master "/etc/keepalived/notify-vip-wg.sh"
    notify_backup "/etc/keepalived/notify-vip-wg.sh"
    notify_fault  "/etc/keepalived/notify-vip-wg.sh"
}
