# Keepalived — preferred VIP owner (example: webdb-a1 = 10.10.40.21)
# Install as /etc/keepalived/keepalived.conf
#
# Design: ALL instances use state BACKUP; priority decides the winner.
# Filename "master" = preferred owner (priority 150), not VRRP state MASTER.
#
# auth_pass: Keepalived truncates to 8 characters — use exactly 8.
# notify_* : update WireGuard AllowedIPs + host route for 10.99.0.10/32
#            (see notify-vip-wg.sh). VIP must stay out of static wg0 AllowedIPs.

global_defs {
    router_id WEBDB_A1
    script_user keepalived_script
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/bin/pidof haproxy"
    interval 2
    weight -30
    fall 2
    rise 2
}

vrrp_instance VI_APP {
    state BACKUP
    interface ens18
    virtual_router_id 40
    priority 150
    advert_int 1

    # Unicast VRRP — no stretched L2; peers are other sites' app VMs
    # Path: webdb → site services gateway (.1) → WireGuard → remote site
    unicast_src_ip 10.10.40.21
    unicast_peer {
        10.20.40.21
        10.30.40.21
    }

    authentication {
        auth_type PASS
        auth_pass ChgMe_01
    }

    virtual_ipaddress {
        10.99.0.10/32
    }

    track_script {
        chk_haproxy
    }

    # Keepalived calls: notify_* <type> <name> <state> <priority>
    notify_master "/etc/keepalived/notify-vip-wg.sh"
    notify_backup "/etc/keepalived/notify-vip-wg.sh"
    notify_fault  "/etc/keepalived/notify-vip-wg.sh"
}
