# Keepalived — preferred VIP owner (example: webdb-a1 = 10.10.40.21)
# Install as /etc/keepalived/keepalived.conf
#
# Design: ALL instances use state BACKUP; priority decides the winner.
# This file is the high-priority peer (150). "master" in the filename means
# preferred owner, not VRRP state MASTER.
#
# auth_pass: Keepalived truncates to 8 characters — use exactly 8.

global_defs {
    router_id WEBDB_A1
    script_user keepalived_script
    enable_script_security
}

# Compatible with enable_script_security (no killall)
vrrp_script chk_haproxy {
    script "/usr/bin/pidof haproxy"
    interval 2
    weight -30
    fall 2
    rise 2
}

vrrp_instance VI_APP {
    # Prefer BACKUP everywhere; highest priority becomes effective master
    state BACKUP
    interface ens18
    virtual_router_id 40
    priority 150
    advert_int 1

    # Unicast VRRP — required without stretched L2 between sites
    unicast_src_ip 10.10.40.21
    unicast_peer {
        10.20.40.21
        10.30.40.21
    }

    authentication {
        auth_type PASS
        # Exactly 8 characters (Keepalived limit)
        auth_pass ChgMe_01
    }

    virtual_ipaddress {
        10.99.0.10/32
    }

    track_script {
        chk_haproxy
    }
}
