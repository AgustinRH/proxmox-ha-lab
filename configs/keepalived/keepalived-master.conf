# Keepalived — preferred VIP owner (example: webdb-a1 = 10.10.40.21)
# Install as /etc/keepalived/keepalived.conf
# All instances can use state BACKUP; the highest priority that passes checks wins.
# This file uses MASTER + priority 150 as the documented preference for Site A.

global_defs {
    # Unique id for this host in logs / SNMP
    router_id WEBDB_A1
    # Drop privileges for notify/health scripts when possible
    script_user keepalived_script
    enable_script_security
}

# Health check: HAProxy must be running or we surrender the VIP
vrrp_script chk_haproxy {
    # Returns 0 if a process named haproxy exists
    script "/usr/bin/killall -0 haproxy"
    interval 2
    weight -30
    fall 2
    rise 2
}

vrrp_instance VI_APP {
    # Preferred owner while healthy
    state MASTER
    # Services VLAN interface name inside the guest (adjust to ens18 / eth0)
    interface ens18
    # Must match on every Keepalived peer for this VIP
    virtual_router_id 40
    # Highest priority in the portfolio example (see docs/architecture.md)
    priority 150
    advert_int 1

    authentication {
        auth_type PASS
        # Shared VRRP password — replace before use
        auth_pass <CHANGE_ME>
    }

    # Application VIP on the services VLAN
    virtual_ipaddress {
        10.10.40.10/24
    }

    track_script {
        chk_haproxy
    }
}
