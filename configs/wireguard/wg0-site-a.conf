# WireGuard — Site A gateway / peer
# Install as /etc/wireguard/wg0.conf on the Site A VPN endpoint (router or Linux VM).
# Generate keys:  wg genkey | tee private.key | wg pubkey > public.key
# Never commit real private keys. Placeholders only.

[Interface]
# Overlay address for Site A (see docs/architecture.md)
Address = 10.10.50.1/24
# UDP listen port for peers B and C
ListenPort = 51820
# This peer's private key
PrivateKey = <PRIVATE_KEY>
# Optional: enable forwarding toward site LANs
# PostUp = sysctl -w net.ipv4.ip_forward=1
# PostUp = iptables -A FORWARD -i wg0 -j ACCEPT
# PostDown = iptables -D FORWARD -i wg0 -j ACCEPT

# --- Peer: Site B ---
[Peer]
# Site B public key
PublicKey = <PUBLIC_KEY>
# WAN / TEST-NET example endpoint for Site B (RFC 5737)
Endpoint = 192.0.2.20:51820
# Site B overlay IP + LAN prefixes reachable via this peer
# Narrow AllowedIPs in production if each site has distinct prefixes
AllowedIPs = 10.10.50.2/32, 10.10.10.12/32, 10.10.20.12/32, 10.10.30.22/32, 10.10.40.31/32, 10.10.40.32/32
# Keep NAT mappings alive behind stateful firewalls
PersistentKeepalive = 25

# --- Peer: Site C ---
[Peer]
PublicKey = <PUBLIC_KEY>
Endpoint = 192.0.2.30:51820
AllowedIPs = 10.10.50.3/32, 10.10.10.13/32, 10.10.20.13/32, 10.10.30.23/32, 10.10.40.41/32, 10.10.40.42/32
PersistentKeepalive = 25
