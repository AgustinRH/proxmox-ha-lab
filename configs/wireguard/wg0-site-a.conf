# WireGuard — Site A gateway / peer
# Install as /etc/wireguard/wg0.conf on the Site A VPN endpoint.
# Generate keys:  wg genkey | tee private.key | wg pubkey > public.key
# Never commit real private keys.

[Interface]
# Overlay address for Site A
Address = 10.255.50.1/24
ListenPort = 51820
PrivateKey = <PRIVATE_KEY>
# Optional forwarding toward site LANs:
# PostUp = sysctl -w net.ipv4.ip_forward=1

# --- Peer: Site B (prefixes 10.20.x.0/24) ---
[Peer]
PublicKey = <PUBLIC_KEY>
Endpoint = 192.0.2.20:51820
# Entire Site B example LANs — not a shared 10.10.40.0/24
AllowedIPs = 10.255.50.2/32, 10.20.10.0/24, 10.20.20.0/24, 10.20.30.0/24, 10.20.40.0/24
PersistentKeepalive = 25

# --- Peer: Site C (prefixes 10.30.x.0/24) ---
[Peer]
PublicKey = <PUBLIC_KEY>
Endpoint = 192.0.2.30:51820
AllowedIPs = 10.255.50.3/32, 10.30.10.0/24, 10.30.20.0/24, 10.30.30.0/24, 10.30.40.0/24
PersistentKeepalive = 25

# VIP 10.99.0.10/32 is intentionally NOT in static AllowedIPs.
# Keepalived notify-vip-wg.sh adds/withdraws it with: wg set ... allowed-ips
# plus a host route (see docs/architecture.md).
