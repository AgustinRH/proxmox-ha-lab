# WireGuard — Site B gateway / peer
# Install as /etc/wireguard/wg0.conf on the Site B VPN endpoint.
# Keys: replace <PRIVATE_KEY> / <PUBLIC_KEY>. Never commit real keys.

[Interface]
# Overlay address for Site B
Address = 10.10.50.2/24
ListenPort = 51820
PrivateKey = <PRIVATE_KEY>
# PostUp / PostDown: same pattern as site-a if this host routes for the site

# --- Peer: Site A ---
[Peer]
PublicKey = <PUBLIC_KEY>
# Site A public endpoint (RFC 5737 example)
Endpoint = 192.0.2.10:51820
# Site A overlay + representative host routes (mgmt, cluster, storage, app VMs)
AllowedIPs = 10.10.50.1/32, 10.10.10.11/32, 10.10.20.11/32, 10.10.30.21/32, 10.10.40.10/32, 10.10.40.21/32, 10.10.40.22/32
PersistentKeepalive = 25

# --- Peer: Site C ---
[Peer]
PublicKey = <PUBLIC_KEY>
Endpoint = 192.0.2.30:51820
AllowedIPs = 10.10.50.3/32, 10.10.10.13/32, 10.10.20.13/32, 10.10.30.23/32, 10.10.40.41/32, 10.10.40.42/32
PersistentKeepalive = 25
