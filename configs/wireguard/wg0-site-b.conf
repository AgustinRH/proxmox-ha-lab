# WireGuard — Site B gateway / peer
# Install as /etc/wireguard/wg0.conf on the Site B VPN endpoint.

[Interface]
Address = 10.255.50.2/24
ListenPort = 51820
PrivateKey = <PRIVATE_KEY>

# --- Peer: Site A (prefixes 10.10.x.0/24) ---
[Peer]
PublicKey = <PUBLIC_KEY>
Endpoint = 192.0.2.10:51820
# Site A LANs only — do NOT pin VIP 10.99.0.10/32 solely to Site A
AllowedIPs = 10.255.50.1/32, 10.10.10.0/24, 10.10.20.0/24, 10.10.30.0/24, 10.10.40.0/24
PersistentKeepalive = 25

# --- Peer: Site C ---
[Peer]
PublicKey = <PUBLIC_KEY>
Endpoint = 192.0.2.30:51820
AllowedIPs = 10.255.50.3/32, 10.30.10.0/24, 10.30.20.0/24, 10.30.30.0/24, 10.30.40.0/24
PersistentKeepalive = 25
