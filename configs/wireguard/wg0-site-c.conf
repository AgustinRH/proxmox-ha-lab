# WireGuard — Site C gateway / peer
# Install as /etc/wireguard/wg0.conf on the Site C VPN endpoint.
# Keys: replace <PRIVATE_KEY> / <PUBLIC_KEY>. Never commit real keys.

[Interface]
# Overlay address for Site C
Address = 10.10.50.3/24
ListenPort = 51820
PrivateKey = <PRIVATE_KEY>

# --- Peer: Site A ---
[Peer]
PublicKey = <PUBLIC_KEY>
Endpoint = 192.0.2.10:51820
AllowedIPs = 10.10.50.1/32, 10.10.10.11/32, 10.10.20.11/32, 10.10.30.21/32, 10.10.40.10/32, 10.10.40.21/32, 10.10.40.22/32
PersistentKeepalive = 25

# --- Peer: Site B ---
[Peer]
PublicKey = <PUBLIC_KEY>
Endpoint = 192.0.2.20:51820
AllowedIPs = 10.10.50.2/32, 10.10.10.12/32, 10.10.20.12/32, 10.10.30.22/32, 10.10.40.31/32, 10.10.40.32/32
PersistentKeepalive = 25
