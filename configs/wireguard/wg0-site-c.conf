# WireGuard — Site C gateway / peer
# Install as /etc/wireguard/wg0.conf on the Site C VPN endpoint.

[Interface]
Address = 10.255.50.3/24
ListenPort = 51820
PrivateKey = <PRIVATE_KEY>

# --- Peer: Site A ---
[Peer]
PublicKey = <PUBLIC_KEY>
Endpoint = 192.0.2.10:51820
# Site A LANs only — VIP reachability is separate (docs/architecture.md)
# VIP 10.99.0.10/32 stays out of static AllowedIPs (notify-vip-wg.sh)
AllowedIPs = 10.255.50.1/32, 10.10.10.0/24, 10.10.20.0/24, 10.10.30.0/24, 10.10.40.0/24
PersistentKeepalive = 25

# --- Peer: Site B ---
[Peer]
PublicKey = <PUBLIC_KEY>
Endpoint = 192.0.2.20:51820
AllowedIPs = 10.255.50.2/32, 10.20.10.0/24, 10.20.20.0/24, 10.20.30.0/24, 10.20.40.0/24
PersistentKeepalive = 25
